<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Avícola Las Tres Cruces — Panel</title>
  <style>
    :root {
      --verde: #1b4332;
      --texto: #1f2933;
      --gris: #6b7280;
      --borde: #e5e7eb;
      --fondo: #f8f9f7;
      --ambar: #b45309;
      --ambar-fondo: #fef3c7;
      --rojo: #b91c1c;
      --rojo-fondo: #fee2e2;
      --resaltado: #d8f3dc;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--fondo);
      color: var(--texto);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 15px;
      line-height: 1.45;
    }
    header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      padding: 20px 32px 12px;
      border-bottom: 1px solid var(--borde);
      background: #fff;
    }
    h1 { margin: 0; font-size: 22px; color: var(--verde); font-weight: 650; }
    h2 { margin: 0 0 10px; font-size: 17px; color: var(--verde); font-weight: 650; }
    .estado-conexion { font-size: 13px; color: var(--gris); }
    main {
      display: grid;
      grid-template-columns: minmax(360px, 2fr) minmax(480px, 3fr);
      gap: 28px;
      padding: 24px 32px 40px;
    }
    @media (max-width: 960px) { main { grid-template-columns: 1fr; } }
    section { background: #fff; border: 1px solid var(--borde); border-radius: 8px; padding: 16px 18px; }
    .cabecera-seccion { display: flex; align-items: center; justify-content: space-between; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { text-align: left; padding: 8px 8px; border-bottom: 1px solid var(--borde); vertical-align: top; }
    th { color: var(--gris); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
    td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
    td.fijo { white-space: nowrap; }
    tr:last-child td { border-bottom: none; }
    .stock { display: inline-block; min-width: 34px; text-align: center; padding: 2px 8px; border-radius: 999px; font-weight: 600; }
    .stock.bajo { background: var(--ambar-fondo); color: var(--ambar); }
    .stock.agotado { background: var(--rojo-fondo); color: var(--rojo); }
    .etiqueta { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: 600; background: #eef2ee; color: var(--verde); }
    .etiqueta.cancelado { background: var(--rojo-fondo); color: var(--rojo); }
    .etiqueta.entregado { background: #e5e7eb; color: #374151; }
    .items { color: var(--gris); font-size: 13px; }
    tr.nuevo { animation: resaltar 4s ease-out; }
    @keyframes resaltar { from { background: var(--resaltado); } to { background: transparent; } }
    .vacio { color: var(--gris); padding: 14px 8px; }
    button {
      font: inherit;
      font-size: 13px;
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid var(--verde);
      background: #fff;
      color: var(--verde);
      cursor: pointer;
    }
    button:hover { background: var(--resaltado); }
    .presentacion { color: var(--gris); font-size: 13px; }
  </style>
</head>
<body>
  <header>
    <h1>Avícola Las Tres Cruces · Panel de demo</h1>
    <span class="estado-conexion" id="conexion">Conectando…</span>
  </header>
  <main>
    <section>
      <div class="cabecera-seccion">
        <h2>Inventario</h2>
        <button id="reiniciar" type="button">Reiniciar demo</button>
      </div>
      <table>
        <thead>
          <tr><th>Producto</th><th class="num">Precio</th><th class="num">Stock</th></tr>
        </thead>
        <tbody id="inventario"></tbody>
      </table>
    </section>
    <section>
      <h2>Pedidos</h2>
      <table>
        <thead>
          <tr><th>Nº</th><th>Hora</th><th>Cliente</th><th>Modalidad</th><th class="num">Total</th><th>Estado</th><th>Ítems</th></tr>
        </thead>
        <tbody id="pedidos"></tbody>
      </table>
    </section>
  </main>
  <script>
    const INTERVALO_MS = 3000;
    const inventarioEl = document.getElementById("inventario");
    const pedidosEl = document.getElementById("pedidos");
    const conexionEl = document.getElementById("conexion");
    let pedidosConocidos = null;

    const pesos = (n) => "$ " + n.toLocaleString("es-CO");
    const hora = (iso) => iso.slice(11, 19);
    const modalidad = (m) => (m === "domicilio" ? "Domicilio" : "Recoger");
    const estadoTexto = { recibido: "Recibido", en_preparacion: "En preparación", entregado: "Entregado", cancelado: "Cancelado" };

    function celda(contenido, clase) {
      const td = document.createElement("td");
      if (clase) td.className = clase;
      if (contenido instanceof Node) td.appendChild(contenido); else td.textContent = contenido;
      return td;
    }

    function pintarInventario(productos) {
      inventarioEl.replaceChildren();
      for (const p of productos) {
        const tr = document.createElement("tr");
        const nombre = document.createElement("div");
        nombre.textContent = p.nombre;
        const presentacion = document.createElement("div");
        presentacion.className = "presentacion";
        presentacion.textContent = p.presentacion;
        const tdNombre = document.createElement("td");
        tdNombre.append(nombre, presentacion);
        const stock = document.createElement("span");
        stock.className = "stock" + (p.stock === 0 ? " agotado" : p.stock <= 3 ? " bajo" : "");
        stock.textContent = p.stock;
        tr.append(tdNombre, celda(pesos(p.precio), "num"), celda(stock, "num"));
        inventarioEl.appendChild(tr);
      }
    }

    function pintarPedidos(pedidos) {
      pedidosEl.replaceChildren();
      if (pedidos.length === 0) {
        const tr = document.createElement("tr");
        tr.appendChild(celda("Todavía no hay pedidos.", "vacio")).colSpan = 7;
        pedidosEl.appendChild(tr);
      }
      const esPrimeraCarga = pedidosConocidos === null;
      const vistos = new Set();
      for (const p of pedidos) {
        vistos.add(p.numero_pedido);
        const tr = document.createElement("tr");
        if (!esPrimeraCarga && !pedidosConocidos.has(p.numero_pedido)) tr.className = "nuevo";
        const estado = document.createElement("span");
        estado.className = "etiqueta " + p.estado;
        estado.textContent = estadoTexto[p.estado] || p.estado;
        const items = p.items.map((i) => `${i.cantidad}× ${i.nombre}`).join(", ");
        tr.append(
          celda(p.numero_pedido, "fijo"),
          celda(hora(p.creado_en), "fijo"),
          celda(p.cliente),
          celda(modalidad(p.modalidad)),
          celda(pesos(p.total), "num"),
          celda(estado),
          celda(items, "items")
        );
        pedidosEl.appendChild(tr);
      }
      pedidosConocidos = vistos;
    }

    async function refrescar() {
      try {
        const res = await fetch("/admin/data", { cache: "no-store" });
        if (!res.ok) throw new Error("HTTP " + res.status);
        const datos = await res.json();
        pintarInventario(datos.inventario);
        pintarPedidos(datos.pedidos);
        conexionEl.textContent = "Actualizado " + new Date().toLocaleTimeString("es-CO");
      } catch (err) {
        conexionEl.textContent = "Sin conexión con el servidor (" + err.message + ")";
      }
    }

    document.getElementById("reiniciar").addEventListener("click", async () => {
      if (!confirm("¿Reiniciar la demo? Se borran todos los pedidos y el inventario vuelve al seed.")) return;
      try {
        const res = await fetch("/admin/reset-ui", { method: "POST" });
        if (!res.ok) throw new Error("HTTP " + res.status);
        pedidosConocidos = null;
        await refrescar();
      } catch (err) {
        alert("No se pudo reiniciar: " + err.message);
      }
    });

    refrescar();
    setInterval(refrescar, INTERVALO_MS);
  </script>
</body>
</html>
